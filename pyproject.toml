[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "limbus-guides"
version = "0.1.0"
description = "Limbus Company wiki-grounded identity guide generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "spacy>=3.7.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3.0"]
# Embedding-similarity teammates are a ranked-last fallback behind the synergy rules.
# They pull in torch (~2GB); the pipeline runs without them via `--no-embeddings`.
embeddings = ["sentence-transformers>=2.6.0"]

[project.scripts]
limbus-pipeline = "limbus_guides.pipeline.run:main"
limbus-dashboard = "limbus_guides.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
